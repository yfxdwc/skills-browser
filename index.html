<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skills Browser</title>
<style>
/* ── Reset & Variables ──────────────────────────────────────────────── */
*,::before,::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:        #ffffff;
  --bg0:       #F8F9FB;
  --bg1:       #EEF1F6;
  --bg2:       #E4E8F0;
  --border:    #E2E6F0;
  --border2:   #C8D0E0;
  --text:      #1A1D27;
  --text2:     #4B5268;
  --text3:     #8892A8;
  --accent:    #0B6BF2;      /* 飞书蓝 */
  --accent2:   #0D5CE6;
  --accent-light: #EBF2FF;
  --accent-glow: rgba(11,107,242,.10);
  --danger:    #EF4444;
  --w-left:    300px;
  --w-right:    400px;
  --radius:    12px;
  --radius-sm: 8px;
  --shadow:    0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --font:      'Inter','-apple-system','BlinkMacSystemFont','Segoe UI',sans-serif;
  --mono:      'JetBrains Mono','Fira Code','Consolas',monospace;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg0);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;      /* 全局字号加大 */
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;height:100vh;overflow:hidden}

/* ── Scrollbars ──────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
::selection{background:var(--accent-light);color:var(--accent)}

/* ── Resize Handles ──────────────────────────────────────────────────── */
.resize-handle{
  width:5px;flex-shrink:0;cursor:col-resize;
  background:transparent;position:relative;z-index:20;
}
.resize-handle::after{
  content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:3px;height:40px;border-radius:2px;
  background:var(--border2);opacity:0;transition:opacity .2s;
}
.resize-handle:hover::after{opacity:1;background:var(--accent)}

/* ══════════════════════════════════════════════════════════════════════ */
/* LEFT PANEL                                                               */
/* ══════════════════════════════════════════════════════════════════════ */
.left{
  width:var(--w-left);min-width:var(--w-left);
  background:var(--bg);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:2px 0 8px rgba(0,0,0,.03);z-index:10;
}
.left-header{
  padding:20px 16px 14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg);
}
.left-logo{
  width:32px;height:32px;
  background:linear-gradient(135deg,#4F6AF0,#6B8AFF);
  border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;box-shadow:0 2px 8px rgba(79,106,240,.3);color:#fff;
}
.left-title{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.left-subtitle{font-size:12px;color:var(--text3);margin-top:1px}

.agent-list{flex:1;overflow-y:auto;padding:10px 8px}
.agent-item{margin-bottom:2px}

.agent-header{
  display:flex;align-items:center;padding:10px 12px;
  border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:600;
  color:var(--text2);gap:10px;transition:all .15s;
  border:1px solid transparent;
}
.agent-header:hover{background:var(--bg1);color:var(--text);border-color:var(--border)}
.agent-header.open{background:var(--accent-light);color:var(--accent);border-color:rgba(11,107,242,.2)}
/* Hermes — 橙色强调 */
.eco-section[data-eco="hermes"] .agent-header .agent-icon{
  background:linear-gradient(135deg,#E85D04,#FFBA08)!important;
  color:#fff!important;
  box-shadow:0 2px 8px rgba(232,93,4,.35);
}
.eco-section[data-eco="hermes"] .agent-header.special-agent.open{
  color:#E85D04!important;
}
/* OpenClaw — 蓝色强调 */
.eco-section[data-eco="openclaw"] .agent-header .agent-icon{
  background:linear-gradient(135deg,#0369A1,#0EA5E9)!important;
  color:#fff!important;
  box-shadow:0 2px 8px rgba(3,105,161,.35);
}
.eco-section[data-eco="openclaw"] .agent-header.special-agent.open{
  color:#0369A1!important;
}
/* 共享 badge */
.agent-badge{
  font-size:10px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#E85D04,#FFBA08);
  color:#fff;border-radius:20px;
  padding:1px 7px;text-transform:uppercase;
  box-shadow:0 1px 4px rgba(232,93,4,.25);
}
.agent-icon{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.agent-header.open .agent-icon{box-shadow:0 0 0 3px rgba(11,107,242,.15)}
.agent-name{flex:1}
.agent-arrow{color:var(--text3);font-size:10px;transition:transform .2s}
.agent-header.open .agent-arrow{transform:rotate(90deg);color:var(--accent)}
.agent-count{
  font-size:11px;color:var(--text3);background:var(--bg1);
  padding:2px 8px;border-radius:10px;font-weight:600;
  border:1px solid var(--border);
}
/* Ecosystem sections */
.eco-section{
  margin-bottom:4px;border-radius:var(--radius-sm);overflow:hidden;
  border-top:3px solid var(--eco-top, var(--border));
  background:var(--eco-bg, var(--bg));
}
.eco-header{
  display:flex;align-items:center;padding:8px 12px;
  cursor:pointer;user-select:none;
  background:transparent;
  border-bottom:1px solid rgba(0,0,0,.06);
  transition:background .15s;
}
.eco-header:hover{background:rgba(0,0,0,.03)}
.eco-label{
  flex:1;font-size:10px;font-weight:800;letter-spacing:1.2px;
  color:var(--eco-top, var(--text2));text-transform:uppercase;
}
.eco-arrow{font-size:9px;color:var(--eco-top, var(--text3));transition:transform .2s}
.eco-header.open .eco-arrow{transform:rotate(180deg)}
.eco-agents{display:none}
.eco-agents .agent-item{border-radius:0}
.eco-agents .agent-header{
  padding-left:16px;
  border-top:none!important;
  border-left:none!important;
  border-right:none!important;
  background:transparent!important;
}
.eco-agents .agent-header:hover{background:var(--bg1)!important}
.eco-agents .agent-header.open{
  background:var(--eco-bg, var(--bg))!important;
  color:var(--eco-top, var(--accent))!important;
}

.agent-skills{display:none;padding:4px 0 8px 0}
.agent-skills.open{display:block}

/* ── Folder groups ── */
.skills-group{margin-bottom:2px}
.skills-group-header{
  display:flex;align-items:center;
  padding:7px 12px 7px 16px;
  font-size:13.5px;font-weight:600;color:var(--text2);
  cursor:pointer;gap:7px;
  border-radius:var(--radius-sm);margin-right:8px;
  transition:all .12s;
  user-select:none;
}
.skills-group-header:hover{background:var(--bg1);color:var(--text)}
.skills-group-header .folder-arrow{
  font-size:10px;color:var(--text3);transition:transform .2s;
}
.skills-group-header.open .folder-arrow{transform:rotate(90deg);color:var(--accent)}
.skills-group-header .folder-name{flex:1}
.skills-group-header .folder-count{
  font-size:10px;color:var(--text3);background:var(--bg1);
  padding:1px 6px;border-radius:8px;font-weight:600;
  border:1px solid var(--border);
}
.skills-group-items{
  display:none;
  padding:2px 0 4px;
}
.skills-group-items.open{display:block}

/* ── Skill items ── */
.skill-item{
  display:flex;align-items:center;
  padding:8px 12px 8px 32px;
  font-size:14px;color:var(--text2);cursor:pointer;gap:8px;
  border-left:2px solid transparent;
  transition:all .12s;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-right:8px;
  user-select:none;
}
.skill-item:hover{color:var(--text);background:var(--bg1);border-left-color:var(--border2)}
.skill-item.active{color:var(--accent);background:var(--accent-light);border-left-color:var(--accent);font-weight:600}
.skill-icon{font-size:12px;opacity:.6;flex-shrink:0}
.skill-item:hover .skill-icon,.skill-item.active .skill-icon{opacity:1}
.skill-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:var(--indent,0)}
.skill-agent-badge{
  font-size:10px;padding:2px 7px;border-radius:6px;
  background:var(--bg2);color:var(--text3);flex-shrink:0;font-weight:700;
  border:1px solid var(--border);letter-spacing:.2px;
}

/* ══════════════════════════════════════════════════════════════════════ */
/* CENTER PANEL                                                             */
/* ══════════════════════════════════════════════════════════════════════ */
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg0)}

.center-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:var(--bg);flex-shrink:0;
  min-height:56px;
}
.center-header-icon{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
}
.skill-title{font-size:16px;font-weight:700;color:var(--text);flex:1}
.skill-title.loading{color:var(--text3)}
.skill-title.error{color:var(--danger)}
.skill-agent-tag{
  font-size:12px;font-weight:700;padding:2px 10px;border-radius:8px;
  display:none;flex-shrink:0;
}
.skill-path{
  font-size:11px;color:var(--text3);font-family:var(--mono);
  display:none;flex-shrink:0;max-width:300px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}

.center-body{
  flex:1;overflow-y:auto;padding:28px 32px;
  display:flex;flex-direction:column;
}

.center-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:40px;
}
.center-empty-icon{font-size:56px;opacity:.2}
.center-empty-title{font-size:17px;font-weight:700;color:var(--text2)}
.center-empty-desc{font-size:14px;color:var(--text3);max-width:280px;line-height:1.8}

/* Skill content styles */
.sk-content{width:100%;max-width:820px}
.sk-content h1{font-size:1.7em;font-weight:800;color:var(--text);margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.sk-content h2{font-size:1.3em;font-weight:700;color:var(--text);margin:28px 0 12px}
.sk-content h3{font-size:1.1em;font-weight:700;color:var(--text);margin:20px 0 10px}
.sk-content h4{font-size:1em;font-weight:700;color:var(--text2);margin:16px 0 8px}
.sk-content p{margin:12px 0;color:#3A4058;line-height:1.95;font-size:15px}
.sk-content p:first-child{margin-top:0}
.sk-content ul,.sk-content ol{margin:12px 0;padding-left:26px;color:#3A4058;font-size:15px;line-height:1.95}
.sk-content li{margin:5px 0}
.sk-content ul{list-style:disc}
.sk-content ol{list-style:decimal}
.sk-content a{color:var(--accent);text-decoration:none;font-weight:500;border-bottom:1px solid rgba(11,107,242,.3)}
.sk-content a:hover{border-bottom-color:var(--accent)}
.sk-content strong{font-weight:700;color:var(--text)}
.sk-content em{font-style:italic;color:var(--text2)}
.sk-content code{font-family:var(--mono);font-size:.88em;color:var(--accent2);background:var(--bg1);padding:2px 7px;border-radius:4px}
.sk-content pre{background:#1A1D27;border-radius:var(--radius);padding:18px 20px;overflow-x:auto;margin:16px 0}
.sk-content pre code{background:none;padding:0;color:#E4E8F0;font-size:.84em;line-height:1.8}
.sk-content blockquote{margin:16px 0;padding:12px 18px;border-left:3px solid var(--accent);background:var(--bg0);border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--text2);font-style:italic;font-size:14px}
.sk-content hr{margin:24px 0;border:none;border-top:1px solid var(--border)}

/* ── 开发者模式开关 ── */
.dev-toggle{
  display:flex;align-items:center;gap:8px;
  margin-left:auto;padding:0 4px;
  cursor:pointer;user-select:none;
}
.dev-toggle-label{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.3px}
.dev-toggle-switch{
  width:36px;height:20px;background:var(--bg2);
  border-radius:10px;position:relative;
  transition:background .2s;cursor:pointer;
  border:1px solid var(--border2);
}
.dev-toggle-switch.on{background:var(--accent);border-color:var(--accent)}
.dev-toggle-thumb{
  position:absolute;top:2px;left:2px;
  width:14px;height:14px;background:#fff;
  border-radius:50%;transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.dev-toggle-switch.on .dev-toggle-thumb{transform:translateX(16px)}
.dev-toggle[title]:hover .dev-toggle-label{color:var(--accent)}

/* ── 编辑工具栏 ── */
.edit-toolbar{
  display:flex;align-items:center;gap:10px;
  padding:8px 20px;background:var(--bg1);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.edit-btn{
  padding:5px 14px;border-radius:6px;
  font-size:13px;font-weight:600;cursor:pointer;
  border:none;transition:all .15s;font-family:var(--font);
}
.edit-save{background:var(--accent);color:#fff}
.edit-save:hover{background:var(--accent2)}
.edit-save:disabled{opacity:.4;cursor:not-allowed}
.edit-cancel{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.edit-cancel:hover{background:var(--bg1)}
.edit-status{font-size:12px;color:var(--text3)}
.edit-status.ok{color:#16A34A}
.edit-status.err{color:var(--danger)}

/* ── Skill 编辑器 ── */
.sk-editor-wrap{
  flex:1;display:flex;overflow:hidden;padding:16px 20px;
}
.sk-editor{
  flex:1;background:#1A1D27;color:#E4E8F0;
  border:none;border-radius:var(--radius);
  padding:16px 20px;font-family:var(--mono);
  font-size:13.5px;line-height:1.75;
  resize:none;outline:none;
  tab-size:2;
}

/* ══════════════════════════════════════════════════════════════════════ */
/* RIGHT PANEL — 飞书风格                                                   */
/* ══════════════════════════════════════════════════════════════════════ */
.right{
  width:var(--w-right);min-width:var(--w-right);
  background:var(--bg);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;z-index:10;
}
.right-header{
  padding:14px 16px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg);
}
.right-header-icon{font-size:15px;opacity:.65}
.right-header-title{font-size:14px;font-weight:700;color:var(--text);flex:1}
.right-header select{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:6px;padding:3px 8px;font-size:12px;color:var(--text2);
  font-family:var(--font);cursor:pointer;
}
.right-header select:focus{outline:none;border-color:var(--accent)}

/* ── Chat area ── */
.chat-area{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}

.chat-welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;padding:20px;
}
.chat-welcome-avatar{
  width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:6px;
}
.chat-welcome-name{font-size:16px;font-weight:800;color:var(--text)}
.chat-welcome-desc{font-size:13px;color:var(--text3);max-width:220px;line-height:1.7}

/* ── Messages — 飞书风格 ── */
.chat-msg{
  display:flex;gap:10px;align-items:flex-end;
  max-width:100%;
}
.chat-msg.user{
  flex-direction:row-reverse;
}

/* 头像 */
.chat-avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}

/* 气泡 */
.chat-bubble{
  max-width:72%;padding:10px 14px;
  font-size:14.5px;line-height:1.75;
  word-break:break-word;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
  border-radius:12px;
}
/* 助手气泡 — 白色卡片，左侧尖角 */
.chat-msg.assistant .chat-bubble{
  background:#ffffff;color:var(--text);
  border-bottom-left-radius:4px;
}
/* 用户气泡 — 飞书蓝，右侧尖角 */
.chat-msg.user .chat-bubble{
  background:var(--accent);color:#ffffff;
  border-bottom-right-radius:4px;
}

/* 气泡内的代码块 */
.chat-bubble pre{
  background:#F5F5F5;border-radius:8px;padding:10px 14px;
  margin:8px 0;overflow-x:auto;font-size:.85em;line-height:1.65;
  white-space:pre;
}
.chat-msg.user .chat-bubble pre{background:rgba(255,255,255,.15)}
.chat-bubble pre code{font-family:var(--mono);color:inherit;background:none;padding:0}
.chat-bubble code:not(pre code){
  font-family:var(--mono);font-size:.88em;
  background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;
}
.chat-msg.user .chat-bubble code:not(pre code){background:rgba(255,255,255,.2)}

/* 错误气泡 */
.bubble-error{background:#FEF2F2!important;color:var(--danger)!important}

/* Skill 上下文卡片 */
.skill-ctx-card{}
.skill-ctx-card .chat-bubble{
  background:var(--bg1);font-size:13px;color:var(--text2);
  border-radius:10px;border-bottom-left-radius:10px;
  box-shadow:none;border:1px solid var(--border);
}

/* 正在输入的点点点 */
.chat-typing{
  display:flex;gap:5px;padding:4px 0;align-items:center;
}
.chat-typing span{
  width:6px;height:6px;border-radius:50%;background:var(--text3);
  animation:tyBounce 1.3s infinite;
}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes tyBounce{
  0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}
}

/* ── 输入栏 ── */
.chat-input-bar{
  padding:12px 14px 14px;border-top:1px solid var(--border);
  display:flex;gap:10px;align-items:flex-end;flex-shrink:0;background:var(--bg);
}
.chat-input{
  flex:1;background:var(--bg0);border:1px solid var(--border2);
  color:var(--text);
  border-radius:10px;padding:10px 14px;font-size:14px;resize:none;
  min-height:42px;max-height:120px;font-family:var(--font);line-height:1.6;
  transition:all .15s;
}
.chat-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);background:var(--bg)}
.chat-input::placeholder{color:var(--text3)}
.chat-send{
  width:38px;height:38px;
  background:var(--accent);border:none;border-radius:10px;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
  box-shadow:0 2px 6px rgba(11,107,242,.25);
}
.chat-send:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 10px rgba(11,107,242,.3)}
.chat-send:active{transform:translateY(0)}
.chat-send:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Utility ──────────────────────────────────────────────────────────── */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<div class="app">

<!-- LEFT ────────────────────────────────────────────────────────────────── -->
<div class="left" id="leftPanel">
  <div class="left-header">
    <div class="left-logo">⚡</div>
    <div class="left-titles">
      <div class="left-title">Skills Browser</div>
      <div class="left-subtitle" id="skillCountLabel">加载中…</div>
    </div>
  </div>
  <div class="agent-list" id="agentList"></div>
</div>

<div class="resize-handle" id="resizeLeft"></div>

<!-- CENTER ──────────────────────────────────────────────────────────────── -->
<div class="center" id="centerPanel">
  <div class="center-header" id="centerHeader">
    <div class="center-header-icon" id="centerIcon">📄</div>
    <span class="skill-title" id="centerTitle">选择左侧 Skill</span>
    <span class="skill-agent-tag" id="centerAgentTag"></span>

    <!-- 开发者模式 -->
    <div class="dev-toggle" id="devToggle" title="开发者模式">

  <!-- 编辑操作栏（隐藏） -->

    <button class="edit-btn edit-save" id="editSave">💾 保存</button>
    <button class="edit-btn edit-cancel" id="editCancel">取消</button>

  <div class="center-body" id="centerBody">
    <div class="center-empty" id="centerEmpty">
      <div class="center-empty-icon">📚</div>
      <div class="center-empty-title">选择 Skill 查看内容</div>
      <div class="center-empty-desc">点击左侧 Agent 展开列表，再点击任意 Skill 即可查看内容并开始对话</div>

<div class="resize-handle" id="resizeRight"></div>

<!-- RIGHT ───────────────────────────────────────────────────────────────── -->
<div class="right" id="rightPanel">
  <div class="right-header">
    <span class="right-header-icon">💬</span>
    <span class="right-header-title">对话</span>

  </div>
  <div class="chat-area" id="chatArea">
    <div class="chat-welcome" id="chatWelcome">
      <div class="chat-welcome-avatar" id="chatWelcomeAvatar">🤖</div>
      <div class="chat-welcome-name" id="chatWelcomeName">Assistant</div>
      <div class="chat-welcome-desc" id="chatWelcomeDesc">选择一个 Agent 开始对话</div>
    </div>
    <div id="chatMessages"></div>
  </div>
  <div class="chat-input-bar">
    <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入消息，按 Enter 发送…" aria-label="输入消息"></textarea>
    <button class="chat-send" id="chatSend" disabled aria-label="发送">▶</button>
  </div>
</div>

</div>
<script>
/* ══════════════════════════════════════════════════════════════════════ */
/* AGENT META                                                               */
/* ══════════════════════════════════════════════════════════════════════ */
const AGENT_META = {
  hermes:       { color: '#E85D04', bg: '#FFF8F0', icon: '⚡', desc: '共享 Skill' },
  openclaw:     { color: '#0369A1', bg: '#E0F2FE', icon: '🦾', desc: '共享 Skill' },
  'openclaw-main': { color: '#0369A1', bg: '#E0F2FE', icon: '🖥️', desc: 'OpenClaw · main' },
  'openclaw-cad':  { color: '#0369A1', bg: '#E0F2FE', icon: '🎨', desc: 'OpenClaw · cad' },
  eva:          { color: '#4F6AF0', bg: '#EEF2FF', icon: '🧠', desc: 'AI 助手' },
  walle:        { color: '#16A34A', bg: '#F0FDF4', icon: '⚙️',  desc: '工作助手' },
  ima:          { color: '#DB2777', bg: '#FDF2F8', icon: '💎',  desc: 'Ima Agent' },
  sysadmin:     { color: '#D97706', bg: '#FFFBEB', icon: '🛡️', desc: '系统管理员' },
};
function meta(agent) { return AGENT_META[agent] || { color: '#6B7280', bg: '#F9FAFB', icon: '🤖', desc: agent } }
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s }

/* ══════════════════════════════════════════════════════════════════════ */
/* DOM CACHE — all elements fetched once                                      */
/* ══════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const dom = {
  agentList:      $('agentList'),
  skillCountLabel:$('skillCountLabel'),
  centerIcon:     $('centerIcon'),
  centerTitle:    $('centerTitle'),
  centerAgentTag: $('centerAgentTag'),
  centerPath:     $('centerPath'),
  centerBody:     $('centerBody'),
  centerEmpty:    $('centerEmpty'),
  skContent:      $('skContent'),
  devToggle:      $('devToggle'),
  devSwitch:      $('devSwitch'),
  editToolbar:    $('editToolbar'),
  editSave:       $('editSave'),
  editCancel:     $('editCancel'),
  editStatus:     $('editStatus'),
  skEditorWrap:   $('skEditorWrap'),
  skEditor:       $('skEditor'),
  chatAgent:      $('chatAgent'),
  chatArea:       $('chatArea'),
  chatMessages:   $('chatMessages'),
  chatInput:      $('chatInput'),
  chatSend:       $('chatSend'),
  chatWelcome:    $('chatWelcome'),
  chatWelcomeAvatar: $('chatWelcomeAvatar'),
  chatWelcomeName:  $('chatWelcomeName'),
  chatWelcomeDesc:  $('chatWelcomeDesc'),
};

/* ══════════════════════════════════════════════════════════════════════ */
/* STATE                                                                     */
/* ══════════════════════════════════════════════════════════════════════ */
const S = {
  agents: [],
  skills: {},
  skillMap: {},
  openAgent: null,
  openSkill: null,
  editMode: false,
  editOriginal: '',
  editDirty: false,
  openGroups: {},  // { ecosystem: bool }

  // Chat
  chatAgents: [],       // same as agents but ordered for dropdown
  chatCurrent: null,    // current chat agent
  conversations: {},    // { agent: [ {role:'user'|'assistant', content}, … ] }
  streaming: false,
};

/* ══════════════════════════════════════════════════════════════════════ */
/* INIT                                                                      */
/* ══════════════════════════════════════════════════════════════════════ */
async function init() {
  // Agents
  const r = await fetch('/api/agents');
  const { agents } = await r.json();
  S.agents = agents;

  renderAgentList();

  // Chat dropdown
  dom.chatAgent.innerHTML = agents.map(a => `<option value="${a}">${cap(a)}</option>`).join('');
  if (agents.length) {
    S.chatCurrent = agents[0];
    dom.chatAgent.value = agents[0];
    updateChatWelcome(agents[0]);
  }

  dom.chatAgent.addEventListener('change', e => {
    S.chatCurrent = e.target.value;
    renderChat(S.chatCurrent);
  });

  // Chat input
  dom.chatInput.addEventListener('input', () => {
    dom.chatInput.style.height = 'auto';
    dom.chatInput.style.height = Math.min(dom.chatInput.scrollHeight, 120) + 'px';
    dom.chatSend.disabled = !dom.chatInput.value.trim();
  });
  dom.chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (dom.chatInput.value.trim()) sendMessage();
    }
  });
  dom.chatSend.addEventListener('click', () => { if (dom.chatInput.value.trim()) sendMessage(); });

  // Developer mode toggle
  dom.devToggle.addEventListener('click', () => toggleEditMode());
  dom.devSwitch.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleEditMode(); } });
  dom.editSave.addEventListener('click', () => saveSkill());
  dom.editCancel.addEventListener('click', () => cancelEdit());
  dom.skEditor.addEventListener('input', () => {
    S.editDirty = dom.skEditor.value !== S.editOriginal;
    dom.editStatus.textContent = S.editDirty ? '● 未保存' : '';
    dom.editStatus.className = 'edit-status';
    dom.editSave.disabled = !S.editDirty;
  });

  // Resize handles
  setupResize();
}

/* ══════════════════════════════════════════════════════════════════════ */
/* AGENT LIST                                                               */
/* ══════════════════════════════════════════════════════════════════════ */
// Ecosystem: which shared agent is the "parent" of an agent
const ECOSYSTEM = {
  hermes:       'hermes',
  openclaw:     'openclaw',
  'openclaw-main': 'openclaw',
  'openclaw-cad':  'openclaw',
  eva:          'hermes',
  walle:        'hermes',
  ima:          'hermes',
  sysadmin:     'hermes',
};
const ECOSYSTEM_COLOR = {
  hermes:   { top: '#E85D04', bg: '#FFF8F0', label: 'HERMES' },
  openclaw: { top: '#0369A1', bg: '#E0F2FE', label: 'OPENCLAW' },
};

function renderAgentList() {
  dom.agentList.innerHTML = '';

  // Separate agents into ecosystems and standalone
  const ecosystemAgents = {};  // ecosystem -> [agents]
  const standalone = [];

  for (const agent of S.agents) {
    const eco = ECOSYSTEM[agent];
    if (eco) {
      if (!ecosystemAgents[eco]) ecosystemAgents[eco] = [];
      ecosystemAgents[eco].push(agent);
    } else {
      standalone.push(agent);
    }
  }

    // Render ecosystem sections
  for (const eco of Object.keys(ecosystemAgents)) {
    const agents_in_eco = ecosystemAgents[eco];
    const ecoMeta = ECOSYSTEM_COLOR[eco];

    // Section container
    const section = document.createElement('div');
    section.className = 'eco-section';
    section.style.setProperty('--eco-top', ecoMeta.top);
    section.style.setProperty('--eco-bg', ecoMeta.bg);
    section.id = `eco-${eco}`;
    section.dataset.eco = eco;

    // Section header (clickable to collapse all)
    const hdr = document.createElement('div');
    hdr.className = 'eco-header';
    hdr.dataset.eco = eco;
    hdr.innerHTML = `
      <span class="eco-label">${ecoMeta.label}</span>
      <span class="eco-arrow">▼</span>`;
    hdr.addEventListener('click', () => toggleEcosystem(eco));
    section.appendChild(hdr);

    // Agent items (always under ecosystem header)
    const list = document.createElement('div');
    list.className = 'eco-agents';
    list.id = `eco-agents-${eco}`;
    list.style.display = S.openGroups[eco] ? 'block' : 'none';

    for (const agent of agents_in_eco) {
      const m = meta(agent);
      const isShared = (agent === eco);
      const a = document.createElement('div');
      a.className = 'agent-item' + (isShared ? ' shared-agent' : '');
      a.innerHTML = `
        <div class="agent-header${isShared ? ' special-agent' : ''}" data-agent="${agent}">
          <span class="agent-icon" style="background:${m.bg};color:${m.color}">${m.icon}</span>
          <span class="agent-name">${isShared ? `<span style="color:${ecoMeta.top};font-weight:800">${m.icon}</span> ` : ''}${isShared ? cap(agent) : cap(agent.replace(/^(hermes|openclaw)-/, ''))}</span>
          ${isShared ? `<span class="agent-badge" style="background:${ecoMeta.top}">共享</span>` : `<span class="agent-badge ws-badge" style="background:${ecoMeta.top}">${eco}</span>`}
          <span class="agent-count" style="display:none"></span>
          <span class="agent-arrow">▶</span>
        </div>
        <div class="agent-skills" id="skills-${agent}"></div>`;
      list.appendChild(a);
      a.querySelector('.agent-header').addEventListener('click', () => toggleAgent(agent));
    }

    section.appendChild(list);
    dom.agentList.appendChild(section);
  }

  // Standalone agents (no ecosystem)
  for (const agent of standalone) {
    const m = meta(agent);
    const item = document.createElement('div');
    item.className = 'agent-item';
    item.innerHTML = `
      <div class="agent-header" data-agent="${agent}">
        <span class="agent-icon" style="background:${m.bg};color:${m.color}">${m.icon}</span>
        <span class="agent-name">${cap(agent)}</span>
        <span class="agent-count" style="display:none"></span>
        <span class="agent-arrow">▶</span>
      </div>
      <div class="agent-skills" id="skills-${agent}"></div>`;
    dom.agentList.appendChild(item);
    item.querySelector('.agent-header').addEventListener('click', () => toggleAgent(agent));
  }
}

async function toggleEcosystem(eco) {
  const section = document.getElementById(`eco-${eco}`);
  const hdr = section.querySelector('.eco-header');
  const list = document.getElementById(`eco-agents-${eco}`);
  const isOpen = S.openGroups[eco];

  if (isOpen) {
    // Collapse
    hdr.classList.remove('open');
    list.style.display = 'none';
    S.openGroups[eco] = false;
  } else {
    // Expand
    hdr.classList.add('open');
    list.style.display = 'block';
    S.openGroups[eco] = true;
    // Auto-open first shared agent if not yet loaded
    const sharedAgent = eco; // e.g. 'hermes' -> hermes is the shared one
    const hdr2 = list.querySelector('.agent-header[data-agent]');
    if (hdr2) toggleAgent(hdr2.dataset.agent);
  }
}

async function toggleAgent(agent) {
  const hdr  = document.querySelector(`.agent-header[data-agent="${agent}"]`);
  const list = document.getElementById(`skills-${agent}`);

  if (hdr.classList.contains('open')) {
    hdr.classList.remove('open');
    list.classList.remove('open');
    return;
  }

  hdr.classList.add('open');

  // Ensure ecosystem is expanded when a child agent is opened
  const eco = ECOSYSTEM[agent];
  if (eco && !S.openGroups[eco]) {
    const section = document.getElementById(`eco-${eco}`);
    if (section) {
      section.querySelector('.eco-header').classList.add('open');
      document.getElementById(`eco-agents-${eco}`).style.display = 'block';
      S.openGroups[eco] = true;
    }
  }

  if (!S.skills[agent]) {
    const r = await fetch(`/api/agents/${agent}`);
    const d = await r.json();
    S.skills[agent] = d.skills || [];
    const existing = hdr.querySelector('.agent-count');
    if (existing) {
      existing.textContent = S.skills[agent].length;
      existing.style.display = 'inline';
    } else {
      const badge = document.createElement('span');
      badge.className = 'agent-count';
      badge.textContent = S.skills[agent].length;
      hdr.appendChild(badge);
    }
    const total = Object.values(S.skills).reduce((a, v) => a + v.length, 0);
    dom.skillCountLabel.textContent = `${total} skills`;
  }
  list.classList.add('open');
  renderSkillList(agent, list);
}

function renderSkillList(agent, list) {
  const skills = S.skills[agent];
  if (!skills || !skills.length) {
    list.innerHTML = '<div style="padding:6px 16px;font-size:13px;color:var(--text3)">无 Skill</div>';
    return;
  }

  // Group by folder: depth1 = root (no folder), depth2+ = parent folder name
  const rootSkills = [];
  const folders = {};  // folderName -> [skills]

  for (const s of skills) {
    if (s.depth === 1) {
      rootSkills.push(s);
    } else {
      const parts = s.relPath.split('/');
      const folder = parts[0];
      if (!folders[folder]) folders[folder] = [];
      folders[folder].push(s);
    }
  }

  const parts = [];

  // Root skills (depth=1, no folder)
  for (let i = 0; i < rootSkills.length; i++) {
    const s = rootSkills[i];
    const idx = S.skills[agent].indexOf(s);
    const id = `si-${agent}-${idx}`;
    S.skillMap[id] = s.path;
    const active = isActiveSkill(agent, s.path);
    parts.push(renderSkillItem(agent, s, id, i, active));
  }

  // Folder groups
  const folderNames = Object.keys(folders).sort();
  for (const folder of folderNames) {
    const folderSkills = folders[folder];
    const groupId = `sg-${agent}-${folder}`;
    // Build items HTML
    const itemsHtml = folderSkills.map((s, fi) => {
      const idx = S.skills[agent].indexOf(s);
      const id = `si-${agent}-${idx}`;
      S.skillMap[id] = s.path;
      const active = isActiveSkill(agent, s.path);
      return renderSkillItem(agent, s, id, fi, active, true);
    }).join('');

    parts.push(`
      <div class="skills-group" id="${groupId}">
        <div class="skills-group-header" data-group="${groupId}">
          <span class="folder-arrow">▶</span>
          <span class="folder-name">📁 ${escHtml(folder)}</span>
          <span class="folder-count">${folderSkills.length}</span>
        </div>
        <div class="skills-group-items">${itemsHtml}</div>
      </div>`);
  }

  list.innerHTML = parts.join('');

  // Attach click handlers for skill items
  list.querySelectorAll('.skill-item').forEach(el => {
    el.addEventListener('click', () => {
      openSkill(el.dataset.agent, el.dataset.name, S.skillMap[el.id]);
    });
  });

  // Attach click handlers for folder group headers
  list.querySelectorAll('.skills-group-header').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.toggle('open');
      const items = el.nextElementSibling;
      if (items) items.classList.toggle('open');
    });
  });
}

function renderSkillItem(agent, s, id, _serial, isActive, nested = false) {
  const indent = nested ? (s.depth - 1) * 12 + 8 : 8;
  return `<div class="skill-item${isActive ? ' active' : ''}"
               id="${id}"
               data-agent="${agent}"
               data-name="${s.name}">
    <span class="skill-icon">${nested ? '　' : '📄'}</span>
    <span class="skill-name" style="--indent:${indent}px">${escHtml(s.name)}</span>
  </div>`;
}

function isActiveSkill(agent, path) {
  return S.openSkill && S.openSkill.path === path && S.openAgent === agent;
}

/* ══════════════════════════════════════════════════════════════════════ */
/* SKILL CONTENT                                                            */
/* ══════════════════════════════════════════════════════════════════════ */
async function openSkill(agent, name, path) {
  if (!path) {
    showError(`路径不存在: ${name}`);
    return;
  }

  // Loading state
  setTitle(`${name}…`, 'loading');
  S.openAgent = agent;
  S.openSkill = { agent, name, path };

  // Update header metadata
  const m = meta(agent);
  dom.centerIcon.textContent = m.icon;
  dom.centerIcon.style.background = m.bg;
  dom.centerIcon.style.color = m.color;
  dom.centerAgentTag.textContent = cap(agent);
  dom.centerAgentTag.style.display = 'inline-flex';
  dom.centerAgentTag.style.color = m.color;
  dom.centerAgentTag.style.background = m.bg;
  dom.centerAgentTag.style.borderColor = `${m.color}30`;
  dom.centerPath.textContent = path;
  dom.centerPath.style.display = 'inline-flex';

  // Show content pane, hide empty
  dom.centerEmpty.style.display = 'none';
  dom.skContent.style.display = 'none';
  // (centerBody stays flex so it scrolls)

  // Highlight active skill
  document.querySelectorAll('.skill-item').forEach(el => {
    el.classList.toggle('active', el.dataset.agent === agent && el.dataset.name === name);
  });

  try {
    const url = `/api/agents/${agent}/content?path=${encodeURIComponent(path)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);

    const d = await r.json();
    if (d.error) throw new Error(d.error);

    // Success — render or edit
    setTitle(name, 'ok');
    if (S.editMode) {
      // Show editor with raw markdown
      dom.skContent.style.display = 'none';
      dom.skEditorWrap.style.display = 'flex';
      dom.editToolbar.style.display = 'flex';
      dom.skEditor.value = d.raw || d.content || '';
      S.editOriginal = dom.skEditor.value;
      S.editDirty = false;
      dom.editSave.disabled = true;
      dom.editStatus.textContent = '';
      dom.editStatus.className = 'edit-status';
    } else {
      // Show rendered HTML
      dom.skContent.innerHTML = d.html || `<pre>${escHtml(d.content || '')}</pre>`;
      dom.skContent.style.display = 'block';
      dom.skEditorWrap.style.display = 'none';
      dom.editToolbar.style.display = 'none';
    }

    // Add context card to chat if chat is active
    if (S.chatCurrent) addSkillContextCard(name, m.icon);

  } catch(e) {
    showError(`加载失败: ${e.message}\n\n路径: ${escHtml(path)}`);
  }
}

function setTitle(text, state) {
  dom.centerTitle.textContent = text;
  dom.centerTitle.className = 'skill-title' + (state ? ' ' + state : '');
}

function showError(msg) {
  setTitle('加载失败', 'error');
  const lines = msg.split('\n');
  dom.skContent.innerHTML = `<div style="color:var(--danger);padding:20px;font-size:13px;line-height:1.8">
    ${lines.map(l => `<div>${l}</div>`).join('')}
  </div>`;
  dom.skContent.style.display = 'block';
  dom.centerEmpty.style.display = 'none';
}

/* ══════════════════════════════════════════════════════════════════════ */
/* DEVELOPER MODE                                                          */
/* ══════════════════════════════════════════════════════════════════════ */
function toggleEditMode() {
  S.editMode = !S.editMode;
  dom.devSwitch.classList.toggle('on', S.editMode);
  dom.devSwitch.setAttribute('aria-checked', S.editMode);

  if (!S.editMode) {
    // Switching OFF: close editor, show content
    dom.editToolbar.style.display = 'none';
    dom.skEditorWrap.style.display = 'none';
    dom.skContent.style.display = 'none';
    dom.centerEmpty.style.display = 'none';
    // Re-load in view mode
    if (S.openSkill) {
      const { agent, name, path } = S.openSkill;
      openSkill(agent, name, path);
    }
  } else {
    // Switching ON: show editor
    dom.editToolbar.style.display = 'flex';
    if (S.openSkill) {
      const { agent, name, path } = S.openSkill;
      openSkill(agent, name, path);
    } else {
      dom.skEditorWrap.style.display = 'flex';
      dom.skContent.style.display = 'none';
      dom.centerEmpty.style.display = 'none';
      dom.skEditor.value = '# 选择一个 Skill 开始编辑\n从左侧选择一个 Skill，这里会显示其原始 Markdown 内容。';
      S.editOriginal = dom.skEditor.value;
      S.editDirty = false;
    }
  }
}

async function saveSkill() {
  if (!S.openSkill || !S.editDirty) return;
  const { agent, name, path } = S.openSkill;
  dom.editSave.disabled = true;
  dom.editStatus.textContent = '保存中…';
  dom.editStatus.className = 'edit-status';
  try {
    const url = `/api/agents/${agent}/content?path=${encodeURIComponent(path)}`;
    const r = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: dom.skEditor.value }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    S.editOriginal = dom.skEditor.value;
    S.editDirty = false;
    dom.editStatus.textContent = '✓ 已保存';
    dom.editStatus.className = 'edit-status ok';
    // Re-render HTML in background so view mode is fresh
    const vr = await fetch(url);
    const vd = await vr.json();
    dom.skContent.innerHTML = vd.html || `<pre>${escHtml(vd.content || '')}</pre>`;
  } catch(e) {
    dom.editStatus.textContent = '✗ 保存失败: ' + e.message;
    dom.editStatus.className = 'edit-status err';
    dom.editSave.disabled = false;
  }
}

function cancelEdit() {
  if (!S.openSkill) return;
  const { agent, name, path } = S.openSkill;
  // Reset editor to original
  dom.skEditor.value = S.editOriginal;
  S.editDirty = false;
  dom.editStatus.textContent = '';
  dom.editStatus.className = 'edit-status';
  dom.editSave.disabled = true;
  // Switch back to view mode
  toggleEditMode();
}

/* ══════════════════════════════════════════════════════════════════════ */
/* CHAT                                                                      */
/* ══════════════════════════════════════════════════════════════════════ */
function updateChatWelcome(agent) {
  const m = meta(agent);
  dom.chatWelcomeAvatar.style.background = m.bg;
  dom.chatWelcomeAvatar.textContent = m.icon;
  dom.chatWelcomeAvatar.style.color = m.color;
  dom.chatWelcomeName.textContent = cap(agent);
  dom.chatWelcomeDesc.textContent = m.desc;
}

function renderChat(agent) {
  updateChatWelcome(agent);
  const conv = S.conversations[agent] || [];
  if (!conv.length) {
    dom.chatWelcome.style.display = 'flex';
    dom.chatMessages.innerHTML = '';
    return;
  }
  dom.chatWelcome.style.display = 'none';
  dom.chatMessages.innerHTML = '';
  for (const msg of conv) {
    appendMessage(msg.role, msg.content, agent);
  }
  dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
}

function appendMessage(role, content, agent) {
  const m = meta(agent);
  const isErr = content.startsWith('[Error');

  // During streaming: update last assistant bubble in-place instead of appending
  if (role === 'assistant') {
    const last = dom.chatMessages.querySelector('.chat-msg.assistant:last-child');
    if (last) {
      last.querySelector('.chat-bubble').innerHTML = linkify(escHtml(content).replace(/\n/g,'<br>'));
      return;
    }
  }

  // Normal case: create new bubble
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  const av = role === 'assistant'
    ? `<div class="chat-avatar" style="background:${m.bg};color:${m.color}">${m.icon}</div>`
    : `<div class="chat-avatar" style="background:var(--accent);color:#fff">U</div>`;
  div.innerHTML = `${av}<div class="chat-bubble${isErr ? ' bubble-error' : ''}">${linkify(escHtml(content).replace(/\n/g,'<br>'))}</div>`;
  dom.chatMessages.appendChild(div);
}

function addSkillContextCard(name, icon) {
  document.querySelectorAll('.skill-ctx-card').forEach(e => e.remove());
  const div = document.createElement('div');
  div.className = 'chat-msg assistant skill-ctx-card';
  div.innerHTML = `<div class="chat-avatar" style="background:var(--bg1);color:var(--text3)">${icon}</div>
    <div class="chat-bubble" style="font-size:13px;color:var(--text2)">
      📋 <strong style="color:var(--accent)">${escHtml(name)}</strong>
    </div>`;
  dom.chatMessages.appendChild(div);
}

async function sendMessage() {
  const text = dom.chatInput.value.trim();
  const agent = S.chatCurrent || S.agents[0] || 'eva';
  if (!text || S.streaming) return;

  dom.chatInput.value = '';
  dom.chatInput.style.height = 'auto';
  dom.chatSend.disabled = true;

  S.conversations[agent] = S.conversations[agent] || [];
  S.conversations[agent].push({ role: 'user', content: text });
  dom.chatWelcome.style.display = 'none';
  appendMessage('user', text, agent);

  const skillName = S.openSkill ? S.openSkill.name : '';
  const tyEl = addTypingIndicator(agent);
  S.streaming = true;

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent, message: text, skill_context: skillName })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let asstText = '';
    S.conversations[agent].push({ role: 'assistant', content: '' });
    const idx = S.conversations[agent].length - 1;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data: ')) {
          try {
            const d = JSON.parse(line.slice(6));
            if (d.type === 'chunk') {
              asstText += d.content;
              S.conversations[agent][idx].content = asstText;
              appendMessage('assistant', asstText, agent);
              // Scroll
              dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
            } else if (d.type === 'done') {
              break;
            }
          } catch(e) { /* ignore parse errors */ }
        }
      }
    }
  } catch(e) {
    S.conversations[agent].push({ role: 'assistant', content: `[Error: ${e.message}]` });
    appendMessage('assistant', `[Error: ${e.message}]`, agent);
  } finally {
    removeTypingIndicator(tyEl);
    S.streaming = false;
  }
}

function addTypingIndicator(agent) {
  const m = meta(agent);
  const div = document.createElement('div');
  div.className = 'chat-msg assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="chat-avatar" style="background:${m.bg};color:${m.color}">${m.icon}</div>
    <div class="chat-bubble"><div class="chat-typing"><span></span><span></span><span></span></div></div>`;
  dom.chatMessages.appendChild(div);
  dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;
  return div;
}
function removeTypingIndicator(el) {
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

/* ══════════════════════════════════════════════════════════════════════ */
/* RESIZE HANDLES                                                            */
/* ══════════════════════════════════════════════════════════════════════ */
function setupResize() {
  let drag = null;
  const dn = id => e => { drag = id; document.body.style.userSelect = 'none'; e.preventDefault(); };
  const mv = e => {
    if (!drag) return;
    const app = document.querySelector('.app').offsetWidth;
    if (drag === 'left') {
      const n = Math.max(180, Math.min(e.clientX, app - 280));
      dom.agentList.parentElement.style.width = n + 'px';
    } else if (drag === 'right') {
      const n = Math.max(240, Math.min(app - e.clientX, app - 200));
      $('rightPanel').style.width = n + 'px';
    }
  };
  const up = () => { drag = null; document.body.style.userSelect = ''; };
  $('resizeLeft').addEventListener('mousedown', dn('left'));
  $('resizeRight').addEventListener('mousedown', dn('right'));
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
}

/* ══════════════════════════════════════════════════════════════════════ */
/* UTILITIES                                                                 */
/* ══════════════════════════════════════════════════════════════════════ */
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function linkify(text) {
  // Very simple: turn URLs into links
  return text.replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank">$1</a>');
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => { init(); });
</script>
